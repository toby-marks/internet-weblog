<script type="text/javascript">

  // @summary: jquery implementation
  $(function() {
    // Only attempt to load Flickr images if the photos container exists
    if ($('#photos').length > 0 && typeof iweblog !== 'undefined') {
      // @summary: Use the author's flickr ID to load images from the public flickr feed
      $.getJSON("https://api.flickr.com/services/feeds/photos_public.gne?id={{ .Site.Params.Author.flickrid }}&format=json&jsoncallback=?")
        .done(function(data) {
          iweblog.application.displayImages(data, 8);
        })
        .fail(function(jqxhr, textStatus, error) {
          console.warn('Failed to load Flickr photos:', textStatus, error);
        });
    }
  });

</script>
